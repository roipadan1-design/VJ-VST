<text x="248" y="126" class="sub">hit threshold</text>
<circle cx="134" cy="156" r="16" fill="#151210" stroke="#3A322C" stroke-width="2.5"/>
<text x="134" y="186" class="lbl" style="fill:#ECE4D6" text-anchor="middle">DETECT</text>
<text x="134" y="198" class="sub" text-anchor="middle">more hits</text>
<circle cx="214" cy="156" r="16" fill="#151210" stroke="#3A322C" stroke-width="2.5"/>
