<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1240" viewBox="0 0 1000 620" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif">
<!-- WIREFRAME sheet: A source (non-lead) view, B NOW-card states, C scene tile states, D knob anatomy. -->
<title>Source view and states</title>
<style>
 .lbl{fill:#A89E90;font-size:9px;letter-spacing:1.2px;font-weight:600}
