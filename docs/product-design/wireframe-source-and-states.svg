 .sub{fill:#8A7F73;font-size:9px}
 .h{fill:#ECE4D6;font-size:16px;font-weight:600}
 .cap{fill:#6FC3D6;font-size:9px;font-family:IBM Plex Mono, Consolas, monospace}
</style>
<rect width="1000" height="620" fill="#0C0A09"/>
<text x="16" y="24" class="cap">A · SOURCE VIEW (non-lead instance, here KICK) · 360 x 220</text>
<rect x="16" y="36" width="360" height="220" rx="2" fill="#151210" stroke="#3A322C"/>
<line x1="16" y1="72" x2="376" y2="72" stroke="#3A322C"/>
