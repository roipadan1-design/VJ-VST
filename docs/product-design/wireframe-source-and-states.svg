<text x="325" y="59" class="lbl" style="fill:#A89E90" text-anchor="middle">TEXT.</text>
<circle cx="60" cy="124" r="22" fill="#F0503F"/>
<circle cx="60" cy="124" r="28" fill="none" stroke="#F0503F" stroke-opacity="0.35"/>
<text x="60" y="166" class="lbl" style="fill:#ECE4D6" text-anchor="middle">KICK</text>
<text x="60" y="178" class="sub" text-anchor="middle">last hit 0.4 s</text>
<text x="108" y="96" class="lbl">LOW BAND</text>
